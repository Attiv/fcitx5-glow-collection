# Fcitx5 Aesthetic Collection — generated
# Style-Catppuccin · Catppuccin — 柔和的拿铁与摩卡配色，现代而舒适
# Palette inspired by Catppuccin (MIT).
# Compact vertical layout with paging buttons hidden.
[Basic]
Theme=System

[LightMode]
OverrideDefault=True
HighlightColor=#8839ef
HighlightHoverColor=#1e66f5
HighlightTextColor=#ffffff
HighlightTextPressColor=#ffffff
HighlightLabelColor=#ffffff
HighlightCommentColor=#ffffff
HighlightMarkColor=#ffffff
PanelColor=#eff1f5
TextColor=#4c4f69
LabelColor=#65687d
CommentColor=#65687d
PagingButtonColor=#65687d
DisabledPagingButtonColor=#65687d
AuxColor=#4c4f69
PreeditColorPreCaret=#4c4f69
PreeditColorCaret=#8839ef
PreeditColorPostCaret=#65687d
BorderColor=#bcc0cc
DividerColor=#eff1f5

[DarkMode]
OverrideDefault=True
HighlightColor=#cba6f7
HighlightHoverColor=#89b4fa
HighlightTextColor=#1e1e2e
HighlightTextPressColor=#1e1e2e
HighlightLabelColor=#1e1e2e
HighlightCommentColor=#1e1e2e
HighlightMarkColor=#1e1e2e
PanelColor=#1e1e2e
TextColor=#cdd6f4
LabelColor=#a6adc8
CommentColor=#a6adc8
PagingButtonColor=#a6adc8
DisabledPagingButtonColor=#a6adc8
AuxColor=#cdd6f4
PreeditColorPreCaret=#cdd6f4
PreeditColorCaret=#cba6f7
PreeditColorPostCaret=#a6adc8
BorderColor=#45475a
DividerColor=#1e1e2e
SameWithLightMode=False

[Typography]
Layout=Vertical
WritingMode="Vertical right-left"
TypographyAwarenessForIM=False
VerticalCommentsAlignRight=True
PagingButtonsStyle=None

[Background]
ImageUrl=
KeepPanelColorWhenHasImage=False
Blur=System
Shadow=True

[Font]
TextFontSize=15
TextFontWeight=400
LabelFontSize=10
LabelFontWeight=400
CommentFontSize=11
CommentFontWeight=400
PreeditFontSize=13
PreeditFontWeight=400

[Font/TextFontFamily]
0="PingFang SC"
1="Helvetica Neue"
2=sans-serif

[Font/LabelFontFamily]
0="SF Mono"
1=Menlo
2=monospace

[Font/CommentFontFamily]
0="PingFang SC"
1="Helvetica Neue"
2=sans-serif

[Font/PreeditFontFamily]
0="SF Mono"
1="PingFang SC"
2=monospace

[Caret]
Style=Blink
Text=‸

[Highlight]
MarkStyle=Bar
MarkText=◆
HoverBehavior=None

[Size]
OverrideDefault=True
BorderWidth=1
BorderRadius=9
Margin=3
HighlightRadius=5
TopPadding=3
RightPadding=8
BottomPadding=3
LeftPadding=8
LabelTextGap=5
VerticalMinWidth=190
ScrollCellWidth=65
HorizontalDividerWidth=0

[Advanced]
UserCss=fcitx:///file/css/style-catppuccin.css


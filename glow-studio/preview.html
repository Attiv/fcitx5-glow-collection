const escapeHTML = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function frameHTML(t, mode, vertical, motion) {
  const p=t[mode];
  const words=['灵感','灵光','灵动','灵巧'];
  const items=words.map((w,i)=>`<div class="fcitx-candidate fcitx-hoverable ${i===0?'fcitx-candidate-first fcitx-highlighted fcitx-highlighted-original':''} ${i===3?'fcitx-candidate-last':''}" role="option" aria-selected="${i===0}" tabindex="${i===0?0:-1}"><div class="fcitx-candidate-background"></div><div class="fcitx-candidate-inner fcitx-hoverable-inner"><div class="fcitx-label">${i+1}</div><div class="fcitx-text">${w}</div>${vertical?'<div class="fcitx-comment">'+['líng gǎn','líng guāng','líng dòng','líng qiǎo'][i]+'</div>':''}</div></div>`).join('');
  const base=`html{color-scheme:dark}html,body{margin:0;background:transparent}body{display:flex;align-items:center;justify-content:center;min-height:158px;padding:25px;box-sizing:border-box;font-family:"PingFang SC","Helvetica Neue",sans-serif}body.vertical{min-height:298px}#fcitx-theme{--gs-motion:${motion?'initial':'none'};font-size:16px}.fcitx-hidden{display:none}.fcitx-panel{border:1px solid ${p.border};border-radius:${t.radius}px;overflow:hidden;width:fit-content;background:${p.panel};box-shadow:0 10px 20px #0002}.fcitx-panel-blur{background:${p.panel}}.fcitx-header{background:${p.panel}}.fcitx-preedit{font:13px "SF Mono",Menlo,"PingFang SC",monospace;display:flex;align-items:center;min-height:24px;margin:5px;padding:4px 10px;color:${p.text}}.fcitx-pre-caret{color:${p.text}}.fcitx-post-caret{color:${p.muted}}.fcitx-caret{width:1px;height:14px;margin:0 2px;background:${p.accent}}.fcitx-hoverables{display:flex;align-items:stretch}.fcitx-vertical{flex-direction:column}.fcitx-candidate{position:relative;cursor:pointer;outline:none}.fcitx-candidate-background{position:absolute;width:100%;height:100%;background:${p.panel}}.fcitx-candidate-inner{position:relative;box-sizing:content-box;display:flex;align-items:center;min-height:24px;line-height:16px;margin:5px;padding:4px 10px;gap:6px;white-space:pre-wrap;border-radius:${t.selected_radius.split(' ').map(v=>v+'px').join(' ')}}.fcitx-horizontal .fcitx-candidate:not(.fcitx-candidate-first) .fcitx-candidate-inner{margin-left:2.5px}.fcitx-horizontal .fcitx-candidate:not(.fcitx-candidate-last) .fcitx-candidate-inner{margin-right:2.5px}.fcitx-vertical .fcitx-candidate{min-width:250px}.fcitx-text{font:500 16px ${t.material==='paper'?'"Songti SC",serif':'"PingFang SC",sans-serif'};color:${p.text}}.fcitx-label{font:11px "SF Mono",Menlo,monospace;color:${p.muted}}.fcitx-comment{font:12px "PingFang SC",sans-serif;color:${p.muted};margin-left:auto}.fcitx-paging{display:flex;flex-direction:column;justify-content:center;font-size:11px;margin-right:7px;color:${p.muted}}.fcitx-paging-inner{padding:2px 4px}.fcitx-candidate:focus-visible{outline:1px dashed ${p.accent};outline-offset:-2px}.fcitx-contextmenu{display:none}`;
  const script=`const all=[...document.querySelectorAll('.fcitx-candidate')];function choose(n){all.forEach((e,i)=>{e.classList.toggle('fcitx-highlighted',i===n);e.setAttribute('aria-selected',i===n);e.tabIndex=i===n?0:-1})}all.forEach((e,i)=>{e.addEventListener('click',()=>choose(i));e.addEventListener('keydown',v=>{let n=i;if(v.key==='ArrowRight'||v.key==='ArrowDown')n=(i+1)%all.length;else if(v.key==='ArrowLeft'||v.key==='ArrowUp')n=(i+all.length-1)%all.length;else if(v.key==='Enter'||v.key===' ')n=i;else return;v.preventDefault();choose(n);all[n].focus()})});document.querySelector('.fcitx-hoverables').addEventListener('mousemove',e=>e.currentTarget.classList.add('fcitx-mousemoved'));`;
  return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>${base}</style><style>${styles[t.id]}</style><body class="${vertical?'vertical':''}"><div id="fcitx-theme" class="fcitx-macos fcitx-macos-15 fcitx-basic fcitx-blue fcitx-${mode}"><div class="fcitx-decoration"><div class="fcitx-panel-center"><div class="fcitx-panel fcitx-horizontal-tb"><div class="fcitx-panel-blur"><div class="fcitx-header"><div class="fcitx-preedit"><div class="fcitx-pre-caret">ling'gan</div><div class="fcitx-caret fcitx-no-text"></div><div class="fcitx-post-caret"></div></div></div><div class="fcitx-hoverables fcitx-${vertical?'vertical':'horizontal'}" role="listbox" aria-label="候选词">${items}${vertical?'':'<div class="fcitx-paging"><div class="fcitx-paging-inner">⌃</div><div class="fcitx-paging-inner fcitx-hoverable-inner">⌄</div></div>'}</div></div></div></div></div><div class="fcitx-contextmenu"><div class="fcitx-menu-item">置顶</div></div></div><script>${script}<\/script></body></html>`;
}
function render(){
  const mode=document.getElementById('mode').value;
  const vertical=document.getElementById('layout').value==='vertical';
  const motion=document.getElementById('motion').checked;
  const gallery=document.getElementById('gallery');gallery.replaceChildren();gallery.classList.toggle('vertical',vertical);
  themes.forEach((t,i)=>{
    const card=document.createElement('article');card.className='card';card.dataset.theme=t.id;
    card.innerHTML=`<div class="card-head"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${escapeHTML(t.name)}</h2><span class="effect">${escapeHTML(t.effect)}</span></div><div class="stage"></div><div class="card-foot"><p>${escapeHTML(t.description)}</p><a href="../Glow-${t.id}.conf" download>CONF ↓</a></div>`;
    for(const m of mode==='both'?['dark','light']:[mode]){
      const wrap=document.createElement('div');wrap.className='frame-wrap';
      const tag=document.createElement('span');tag.className='mode-tag';tag.textContent=m.toUpperCase();
      const f=document.createElement('iframe');f.title=t.name+' · '+m;f.dataset.mode=m;f.srcdoc=frameHTML(t,m,vertical,motion);
      wrap.append(tag,f);card.querySelector('.stage').append(wrap);
    }
    gallery.append(card);
  });
  document.getElementById('count').textContent=`${themes.length} DESIGNS / ${mode==='both'?themes.length*2+' PALETTES':mode.toUpperCase()}`;
}
for(const id of ['mode','layout','motion'])document.getElementById(id).addEventListener('change',render);
document.getElementById('reset').addEventListener('click',render);render();
